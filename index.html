<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0e">
<meta name="description" content="Fútbol, NBA y MLB en vivo: partidos, resultados, próximos encuentros, tablas y líderes. Datos de ESPN.">
<title>Frelytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/futbol">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Frelytics</span>
      <span class="brand-tag">BETA</span>
    </a>
    <nav class="sport-switch" aria-label="Deporte">
      <a class="sport-opt" href="#/futbol" data-sport="futbol">FUT</a>
      <a class="sport-opt" href="#/nba" data-sport="nba">NBA</a>
      <a class="sport-opt" href="#/mlb" data-sport="mlb">MLB</a>
    </nav>
    <a class="live-pill" href="#/futbol" hidden><span class="live-dot"></span><span class="live-label">En vivo</span> <span class="live-count"></span></a>
  </div>
  <nav class="tabs" aria-label="Secciones"></nav>
</header>

<main id="app" class="container" aria-live="polite" aria-busy="true">
  <noscript><p class="state">Esta página necesita JavaScript para cargar los partidos.</p></noscript>
</main>

<footer class="footer">
  <div class="container" id="footer-text"></div>
</footer>

</body>
</html>
